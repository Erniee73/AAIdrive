name: mi-apk

# Compila un APK instalable (variante sin mapa) en cada push a main
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Sin clave de Spotify: la parte avanzada de Spotify queda desactivada
      AndroidAutoIdrive_SpotifyApiKey: unset
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Traer las etiquetas de versión del proyecto original
        # el número de versión se calcula a partir de las etiquetas, que no se copiaron al fork
        run: git fetch --tags https://github.com/BimmerGestalt/AAIdrive.git
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
      - name: Cache de dependencias externas
        uses: actions/cache@v4
        with:
          key: aaidrive_external_${{ hashFiles('.github/actions/download-externals-action/download.sh') }}
          path: |
            external
      - name: Descargar dependencias externas
        uses: ./.github/actions/download-externals-action
      - name: Usar la clave de firma fija de B48 Live
        # sin esta clave, cada compilación se firmaría distinto y no se podría instalar encima
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Falta el secreto DEBUG_KEYSTORE_B64 en Settings > Secrets and variables > Actions"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - name: Compilar APK
        run: ./gradlew assembleNomapNonalyticsFullDebug --stacktrace
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: B48-Live
          retention-days: 30
          path: app/build/outputs/apk/**/*.apk
      - name: Publicar el APK como descarga directa
        # siempre en la misma versión "ultima", para descargarla desde el móvil sin zip
        run: |
          cp app/build/outputs/apk/nomapNonalyticsFull/debug/*.apk B48-Live.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima B48-Live.apk --title "Última versión" --notes "Compilada desde ${GITHUB_SHA::7}" --latest
        env:
          GH_TOKEN: ${{ github.token }}
